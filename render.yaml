services:
  - type: web
    name: msmc-website
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn msmc.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: msmc-website.onrender.com,msmc.com.np,www.msmc.com.np
      - key: DATABASE_URL
        fromDatabase:
          name: msmc-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: info@msmc.com.np

databases:
  - name: msmc-db
    databaseName: msmc
    user: msmc
